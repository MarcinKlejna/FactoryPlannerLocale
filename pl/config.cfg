utility_productivity_imported=Bonusy zaimportowane
components_needed_tt=__1__\n[font=default-bold]__2__[/font] w ekwipunku / [font=default-bold]__3__[/font] potrzebne\n[font=default-semibold][color=#84CDEC]__CONTROL_LEFT_CLICK__[/color][/font] aby wytworzyć ten przedmiot
