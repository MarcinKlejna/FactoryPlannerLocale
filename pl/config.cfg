importer_migration_failure=Podany kod pochodzi ze starszej wersji Factory Planner i nie mógł zostać zmigrowany. Może to wynikać z tego, że jest zbyt stary i nie jest już obsługiwany, dane są w jakiś sposób uszkodzone lub wystąpił błąd programistyczny. Jeśli uważasz, że ten kod jest prawidłowy, skontaktuj się z autorem moda na GitHubie.
importer_unpacking_failure=Podany kod nie mógł zostać prawidłowo rozpakowany i zweryfikowany. Może to wynikać z uszkodzenia danych lub błędu programistycznego. Jeśli uważasz, że ten kod jest prawidłowy, skontaktuj się z autorem moda na GitHubie.
